name: Sync pharmacy data from source repo

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest db.sqlite3 from source repo
        run: |
          curl -sL -o /tmp/db.sqlite3 "https://raw.githubusercontent.com/joroshdy12596/ai-pharmacy/main/db.sqlite3"

      - name: Ensure admin account exists in the synced copy
        env:
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          sqlite3 /tmp/db.sqlite3 <<SQL
          INSERT INTO auth_user (password, last_login, is_superuser, username, first_name, last_name, email, is_staff, is_active, date_joined)
          VALUES ('$ADMIN_PASSWORD_HASH', NULL, 1, 'admin', '', '', 'admin@example.com', 1, 1, datetime('now'))
          ON CONFLICT(username) DO UPDATE SET
            password = excluded.password,
            is_superuser = 1,
            is_staff = 1,
            is_active = 1;
          SQL

      - name: Commit and push if changed
        run: |
          if ! cmp -s /tmp/db.sqlite3 db.sqlite3; then
            cp /tmp/db.sqlite3 db.sqlite3
            git config user.name "data-sync-bot"
            git config user.email "actions@github.com"
            git add db.sqlite3
            git commit -m "Sync data from source repo $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No changes - db.sqlite3 already up to date"
          fi
